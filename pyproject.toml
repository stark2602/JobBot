[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jobbot"
version = "0.1.0"
description = "Free-host Job Search & Match bot on a from-scratch agent runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "PyYAML>=6.0.2,<7",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "black>=24.10,<26",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
jobbot = "agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
